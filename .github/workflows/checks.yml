name: Foundation checks
on:
  push:
    branches: [main, foundation/milestone-0]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify with diagnostic output
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log-${{ github.run_id }}
          path: verify.log
          if-no-files-found: ignore
          retention-days: 7
